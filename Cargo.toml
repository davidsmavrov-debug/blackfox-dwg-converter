[package]
name = "blackfox-dwg-test"
version = "0.1.0"
edition = "2021"

[dependencies]
acadrust = { git = "https://github.com/hakanaktt/acadrust.git", rev = "cc2010a415f3d2cfecf574f833febda0076c7572", default-features = false, features = ["import"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
