name: Build BlackFox DWG Converter

on:
  push:
    branches: [master]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: blackfox-dwg-test.exe

          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: blackfox-dwg-test.exe

          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: blackfox-dwg-test

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: blackfox-dwg-test

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: blackfox-dwg-test

          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            binary: blackfox-dwg-test

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install independent DXF reader
        run: python -m pip install ezdxf==1.4.4

      - name: Prepare pinned AcadRust with the R2010 surface fix
        shell: bash
        run: |
          git clone https://github.com/hakanaktt/acadrust.git acadrust-source
          git -C acadrust-source checkout --detach cc2010a415f3d2cfecf574f833febda0076c7572
          git -C acadrust-source apply "$PWD/patches/acadrust-r2010-surface.patch"
          python scripts/use_patched_acadrust.py
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Report Linux runtime dependencies
        if: runner.os == 'Linux'
        run: readelf --version-info target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Report macOS deployment and dynamic libraries
        if: runner.os == 'macOS'
        run: |
          xcrun vtool -show-build target/${{ matrix.target }}/release/${{ matrix.binary }}
          otool -L target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Exercise native converter
        run: python tests/roundtrip.py target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Package executable and notices
        run: |
          python tests/package_release.py package ${{ matrix.target }} target/${{ matrix.target }}/release/${{ matrix.binary }} acadrust-source/LICENSE dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackfox-dwg-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error